<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Showtimes"><meta name="theme-color" content="#080A11">
<title>Showtimes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;--bg:#F2F1F6;--surface:#fff;--surface-2:#E8E7F0;--fg:#1B1A24;--muted:#5F5D72;--line:#D6D4E1;--accent:#F2B134;--on-accent:#241A04;--accent-ink:#B86700;--accent-vivid:#EE9A00;--ok:#1E8A5B;--danger:#B3261E;--glass:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.8);--glass-sel:rgba(242,177,52,.28);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#080A11;--surface:#0F121C;--surface-2:#181B29;--fg:#ECEAF4;--muted:#9D9BB1;--line:#23273A;--accent-ink:#F2B134;--accent-vivid:#F2B134;--ok:#3FB27F;--danger:#FF8A80;--glass:rgba(18,21,33,.66);--glass-line:rgba(255,255,255,.13);--glass-sel:rgba(242,177,52,.22)}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);padding:calc(var(--sat) + 8px) max(16px,env(safe-area-inset-right)) calc(116px + var(--sab)) max(16px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{max-width:640px;margin:0 auto}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* header + marquee bulbs */
.brand{margin:0;padding-top:14px;font:800 44px/.86 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.brand span{color:var(--accent-vivid)}
.sub{margin:8px 0 0;font:500 12px/1.3 var(--font-mono);color:var(--muted);letter-spacing:.02em}
.marq{position:relative;height:10px;margin-top:14px;background:radial-gradient(circle,var(--accent) 2.4px,transparent 3px) 0 50%/16px 10px repeat-x;opacity:.9;overflow:hidden}
.marq::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--bg) 50%,transparent) -60% 0/60% 100% no-repeat;mix-blend-mode:normal;opacity:0}

/* day strip */
.days{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dl{flex:none;width:54px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;border:1px solid transparent;border-radius:14px;background:none}
.dl .wd,.dl .mo{font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dl .dn{font:800 34px/1 var(--font-display);margin:4px 0}
.dl.today .wd,.dl.today .dn{color:var(--accent-vivid)}
.dl[aria-pressed=true]{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 12px rgba(242,177,52,.3)}
.dl[aria-pressed=true] .wd,.dl[aria-pressed=true] .mo,.dl[aria-pressed=true] .dn{color:var(--on-accent)}

/* ticket */
.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.tk{display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(10,8,24,.10),inset 0 1px 0 rgba(255,255,255,.06)}
.poster{flex:none;width:58px;aspect-ratio:2/3;position:relative;border-radius:8px;overflow:hidden;container-type:size;box-shadow:0 5px 14px rgba(0,0,0,.28)}
.pg{position:absolute;inset:0;display:flex;align-items:flex-end;padding:9cqw;background:hsl(var(--h) 38% 30%);color:hsl(var(--h) 70% 92%);box-shadow:inset 0 -2.5cqw 0 hsl(var(--h) 75% 60%)}
.pg b{font:800 19cqw/.92 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere;padding-bottom:5cqw}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}
.info h2{margin:0;font:700 24px/1 var(--font-display);letter-spacing:.01em;overflow-wrap:break-word}
.meta{margin:5px 0 10px;font-size:13px;color:var(--muted)}
.ts{display:flex;flex-wrap:wrap;gap:8px}

/* showtime stub: dashed tear edge with notches */
.st{position:relative;display:flex;flex-direction:column;gap:4px;min-width:86px;padding:8px 10px 8px 14px;background:var(--surface-2);border-radius:10px;border-left:2px dashed var(--line)}
.st::before,.st::after{content:"";position:absolute;left:-9px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.st::before{top:-7px;clip-path:inset(50% 0 0 0)}.st::after{bottom:-7px;clip-path:inset(0 0 50% 0)}
.st .tm{font:500 19px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st .sm{font:500 10px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap}
.st .rel{font:500 10px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--ok);border-radius:2px;transform-origin:left}
.st.lo .bar i{background:var(--accent-vivid)}.st.out .bar i{background:var(--danger)}
.st.nx{box-shadow:0 0 0 2px var(--accent)}
.st.pa,.rw.pa{opacity:.45}

/* room view */
.dhead{display:flex;align-items:center;gap:12px;margin:22px 0 0;height:34px}
.dhead i{flex:1;height:3px;border-radius:2px;background:var(--accent)}
.dhead span{font:700 28px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.rw{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;border-left:2px dashed var(--line)}
.rw .tm{font:500 19px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.rw b{display:block;font:700 20px/1.05 var(--font-display)}
.rw small{display:block;margin:4px 0 5px;font:500 11px var(--font-mono);color:var(--muted)}
.rw .bar{width:100%}.rw.lo .bar i{background:var(--accent-vivid)}.rw.out .bar i{background:var(--danger)}
.msg{margin-top:18px;padding:24px 16px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}

/* glass dock */
.dock{position:fixed;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;max-width:calc(100% - 24px);background:var(--glass);border:1px solid var(--glass-line);border-radius:99px;-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dock button{min-height:44px;padding:0 15px;border:0;border-radius:99px;background:none;font-weight:700;font-size:14px;white-space:nowrap}
.dock button[aria-pressed=true]{background:var(--glass-sel);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.dock hr{width:1px;height:24px;margin:0 4px;border:0;background:var(--glass-line)}

@media(prefers-reduced-motion:no-preference){
 .dock button,.dl{transition:background-color .25s ease,color .25s ease,transform .15s ease}
 .dock button:active,.dl:active{transform:scale(.92)}
 .tk,.st,.rw{transition:transform .1s}
 .tk:active,.rw:active{transform:scale(.975)}.st:active{transform:scale(.94)}
 .go .tk,.go .rw,.go .dhead{animation:rise .32s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
 .go .bar i{animation:fill .6s cubic-bezier(.2,.7,.3,1) .15s backwards}
 .marq::after{animation:sweep 1.6s ease .3s 1}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}}
 @keyframes fill{from{transform:scaleX(0)}}
 @keyframes sweep{0%{opacity:1;background-position:-60% 0}100%{opacity:1;background-position:160% 0}}
}
</style>
</head>
<body>
<div class="app">
<h1 class="brand">Show<span>times</span></h1>
<p class="sub" id="up">&nbsp;</p>
<div class="marq" aria-hidden="true"></div>
<div class="days" id="days" role="group" aria-label="Day"></div>
<main class="list" id="out"></main>
</div>
<nav class="dock" id="dock" aria-label="Cinema and view"></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{return v==null?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360};
const mins=s=>Math.round((new Date(s.date+'T'+s.time)-new Date())/6e4);
const past=s=>mins(s)<0;
let D,cin=ls('sh:c')||'',day='',mode='film';
function cls(s){return s.total?(s.free<=0?' out':s.free/s.total<.2?' lo':''):''}
function bar(s){return s.total?'<div class="bar"><i style="--w:'+Math.max(2,Math.round(s.free/s.total*100))+'%"></i></div>':''}
function rel(m){return m<60?'in '+m+' min':'in '+Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'')}
function stub(s,nx){
  const sm=[s.room?'Room '+s.room:'',s.lang].filter(Boolean).join(' · '),seats=s.total?(s.free<=0?'sold out':s.free+' free'):'';
  return '<a class="st'+cls(s)+(past(s)?' pa':'')+(nx?' nx':'')+'" href="'+E(s.url)+'" target="_blank" rel="noopener"><span class="tm">'+E(s.time)+'</span>'+(nx?'<span class="rel">'+rel(mins(s))+'</span>':'')+(sm?'<span class="sm">'+E(sm)+'</span>':'')+bar(s)+(seats?'<span class="sm">'+seats+'</span>':'')+'</a>';
}
function render(go){
  if(!D.cinemas[cin])cin=Object.keys(D.cinemas)[0];
  const C=D.cinemas[cin],all=C.shows,t=ymd(new Date()),days=[...new Set(all.map(s=>s.date))].sort();
  if(!days.includes(day))day=days.find(d=>d>=t)||days[0]||'';
  const rooms=all.some(s=>s.room),L=all.filter(s=>s.date==day).sort((a,b)=>a.time.localeCompare(b.time));
  if(!rooms)mode='film';
  const nxt=day==t?L.find(s=>!past(s)&&mins(s)<=240):null;
  $('#up').textContent=C.name+' · updated '+new Date(D.updated).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  $('#days').innerHTML=days.map(d=>{const x=new Date(d+'T12:00');return '<button class="dl'+(d==t?' today':'')+'" data-d="'+d+'" aria-pressed="'+(d==day)+'"><span class="wd">'+(d==t?'Today':WD[x.getDay()])+'</span><span class="dn">'+x.getDate()+'</span><span class="mo">'+MO[x.getMonth()]+'</span></button>'}).join('');
  $('#dock').innerHTML=Object.keys(D.cinemas).map(k=>'<button data-c="'+k+'" aria-pressed="'+(k==cin)+'">'+E(D.cinemas[k].city)+'</button>').join('')+(rooms?'<hr><button data-m="film" aria-pressed="'+(mode=='film')+'">Film</button><button data-m="room" aria-pressed="'+(mode=='room')+'">Room</button>':'');
  let h='',n=0;
  if(mode=='room'){
    const r={};L.forEach(s=>(r[s.room||'?']=r[s.room||'?']||[]).push(s));
    h=Object.keys(r).sort((a,b)=>(+a||99)-(+b||99)).map(k=>'<div class="dhead" style="--i:'+(n++)+'"><i></i><span>'+(k=='?'?'Room not loaded':'Room '+k)+'</span></div>'+r[k].map(s=>'<a class="rw'+cls(s)+(past(s)?' pa':'')+'" style="--i:'+(n++)+'" href="'+E(s.url)+'" target="_blank" rel="noopener"><span class="tm">'+E(s.time)+'</span><span><b>'+E(s.title)+'</b><small>'+E([s.lang,s.total?(s.free<=0?'sold out':s.free+'/'+s.total+' free'):''].filter(Boolean).join(' · '))+'</small>'+bar(s)+'</span></a>').join('')).join('');
  }else{
    const g={};L.forEach(s=>(g[s.title]=g[s.title]||[]).push(s));
    h=Object.keys(g).map(k=>'<section class="tk" style="--i:'+(n++)+'"><span class="poster"><span class="pg" style="--h:'+hue(k)+'"><b>'+E(k.split(/\s+/).slice(0,2).join(' '))+'</b></span>'+(g[k].find(s=>s.poster)?'<img src="https://image.tmdb.org/t/p/w185'+g[k].find(s=>s.poster).poster+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span><div class="info"><h2>'+E(k)+'</h2><p class="meta">'+(g[k][0].min?g[k][0].min+' min':'&nbsp;')+'</p><div class="ts">'+g[k].map(s=>stub(s,s===nxt)).join('')+'</div></div></section>').join('');
  }
  const o=$('#out');o.classList.remove('go');
  o.innerHTML=h||'<p class="msg">No showings listed for this day.</p>';
  if(go){void o.offsetWidth;o.classList.add('go')}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!D)return;
  if(b.dataset.c){cin=b.dataset.c;ls('sh:c',cin);day=''}else if(b.dataset.d)day=b.dataset.d;else if(b.dataset.m)mode=b.dataset.m;else return;
  render(true);
});
fetch('showtimes.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;render(true)}).catch(()=>{$('#out').innerHTML='<p class="msg">Showtimes could not be loaded. Run the scraper once so showtimes.json exists.</p>'});
</script>
</body>
</html>
