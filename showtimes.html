<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Showtimes"><meta name="theme-color" content="#DC3028">
<title>Showtimes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;--bg:#F2F1F6;--sf:#fff;--sf2:#EEEDF4;--fg:#1B1A24;--mu:#5F5D72;--ln:#D9D7E3;--ac:#E5372F;--ok:#1E8A5B;--wa:#C2630F;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--fd:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--fb:'Hanken Grotesk',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0B0B0D;--sf:#16161A;--sf2:#202026;--fg:#F5F5F7;--mu:#9A9AA3;--ln:#2A2A31;--ac:#F0453C;--ok:#3FB27F;--wa:#FFA24D}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--fb);padding:0 max(16px,env(safe-area-inset-right)) calc(32px + var(--sab)) max(16px,env(safe-area-inset-left))}
.app{max-width:560px;margin:0 auto}button,a{font:inherit;color:inherit}button{cursor:pointer}
header{margin:0 -16px;padding:calc(var(--sat) + 14px) 16px 14px;border-radius:0 0 26px 26px;background:linear-gradient(180deg,#E8382F,#C6251D);color:#fff;box-shadow:0 8px 24px rgba(150,20,10,.3)}
h1{margin:0;font:800 32px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase}h1 span{opacity:.7}
.up{margin:6px 0 0;font:500 11px var(--fm);opacity:.85}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px}
#seg{margin-top:12px;background:rgba(0,0,0,.2)}#seg button{min-height:40px;border:0;border-radius:10px;background:none;color:#fff;font-weight:700}#seg button[aria-pressed=true]{background:#fff;color:#C6251D}
#mode{margin-top:12px;background:var(--sf);border:1px solid var(--ln)}#mode button{min-height:36px;border:0;border-radius:10px;background:none;color:var(--mu);font-weight:700}#mode button[aria-pressed=true]{background:var(--ac);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.days button{flex:none;min-width:56px;padding:8px 0 6px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);font:800 22px/1 var(--fd)}
.days small{display:block;margin-bottom:4px;font:500 10px var(--fm);color:var(--mu)}
.days button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}.days button[aria-pressed=true] small{color:#fff}
.f{display:flex;gap:12px;margin-top:10px;padding:10px;background:var(--sf);border:1px solid var(--ln);border-radius:16px}
.pg{flex:none;width:60px;aspect-ratio:2/3;display:flex;align-items:flex-end;padding:5px;border-radius:8px;overflow:hidden;overflow-wrap:anywhere;background:hsl(var(--h) 38% 30%);color:hsl(var(--h) 70% 92%);box-shadow:inset 0 -3px 0 hsl(var(--h) 75% 60%);font:800 11px/.95 var(--fd);text-transform:uppercase}
.fi{min-width:0;flex:1}h2{margin:0;font:700 22px/1 var(--fd)}.fi p{margin:4px 0 8px;font-size:12px;color:var(--mu)}
.ts{display:flex;flex-wrap:wrap;gap:6px}
.t{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 10px;border-radius:10px;background:var(--sf2);border-left:3px solid var(--ok);text-decoration:none}
.t b{font:800 20px/1 var(--fd)}.t small{margin-top:3px;font:500 9px var(--fm);color:var(--mu);white-space:nowrap}
.t.lo{border-left-color:var(--wa)}.pa{opacity:.45}
h3{margin:18px 2px 6px;font:800 18px var(--fd);letter-spacing:.06em;color:var(--mu)}
.row{display:flex;gap:12px;align-items:center;margin-bottom:6px;padding:10px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;text-decoration:none}
.row b{min-width:48px;font:800 20px var(--fd)}.row span{flex:1;min-width:0}.row small,.row i{font:500 11px var(--fm);color:var(--mu);font-style:normal}
.msg{margin-top:14px;padding:22px 16px;border:1px dashed var(--ln);border-radius:14px;text-align:center;color:var(--mu)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header><h1>Show<span>times</span></h1><p class="up" id="up">&nbsp;</p><nav class="seg" id="seg" aria-label="Cinema"></nav></header>
<div class="days" id="days"></div>
<nav class="seg" id="mode" aria-label="View" hidden><button data-m="film">By film</button><button data-m="room">By room</button></nav>
<main id="out"></main>
</div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{return v==null?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360};
const past=s=>{const n=new Date();return s.date+' '+s.time<ymd(n)+' '+p2(n.getHours())+':'+p2(n.getMinutes())};
let D,cin=ls('sh:c')||'',day='',mode='film';
function pill(s){
  const lo=s.total&&s.free/s.total<.2,sub=[s.room?'Room '+s.room:'',s.total?s.free+'/'+s.total+' free':'',s.lang].filter(Boolean).join(' · ');
  return '<a class="t'+(lo?' lo':'')+(past(s)?' pa':'')+'" href="'+E(s.url)+'" target="_blank" rel="noopener"><b>'+E(s.time)+'</b>'+(sub?'<small>'+E(sub)+'</small>':'')+'</a>';
}
function render(){
  if(!D.cinemas[cin])cin=Object.keys(D.cinemas)[0];
  const C=D.cinemas[cin],all=C.shows,t=ymd(new Date()),days=[...new Set(all.map(s=>s.date))].sort();
  if(!days.includes(day))day=days.find(d=>d>=t)||days[0]||'';
  const rooms=all.some(s=>s.room),L=all.filter(s=>s.date==day).sort((a,b)=>a.time.localeCompare(b.time));
  if(!rooms)mode='film';
  $('#seg').innerHTML=Object.keys(D.cinemas).map(k=>'<button data-c="'+k+'" aria-pressed="'+(k==cin)+'">'+E(D.cinemas[k].city)+'</button>').join('');
  $('#up').textContent=C.name+' · updated '+new Date(D.updated).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  $('#days').innerHTML=days.map(d=>{const x=new Date(d+'T12:00');return '<button data-d="'+d+'" aria-pressed="'+(d==day)+'"><small>'+(d==t?'Today':WD[x.getDay()])+'</small>'+x.getDate()+'</button>'}).join('');
  $('#mode').hidden=!rooms;
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==mode));
  let h='';
  if(mode=='room'){
    const r={};L.forEach(s=>(r[s.room||'?']=r[s.room||'?']||[]).push(s));
    h=Object.keys(r).sort((a,b)=>(+a||99)-(+b||99)).map(k=>'<h3>'+(k=='?'?'Room not loaded yet':'Room '+k)+'</h3>'+r[k].map(s=>'<a class="row'+(past(s)?' pa':'')+'" href="'+E(s.url)+'" target="_blank" rel="noopener"><b>'+E(s.time)+'</b><span>'+E(s.title)+' <small>'+E(s.lang)+'</small></span><i>'+(s.total?s.free+'/'+s.total:'')+'</i></a>').join('')).join('');
  }else{
    const g={};L.forEach(s=>(g[s.title]=g[s.title]||[]).push(s));
    h=Object.keys(g).map(k=>'<section class="f"><span class="pg" style="--h:'+hue(k)+'">'+E(k.split(/\s+/).slice(0,2).join(' '))+'</span><div class="fi"><h2>'+E(k)+'</h2><p>'+(g[k][0].min?g[k][0].min+' min':'')+'</p><div class="ts">'+g[k].map(pill).join('')+'</div></div></section>').join('');
  }
  $('#out').innerHTML=h||'<p class="msg">No showings listed for this day.</p>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!D)return;
  if(b.dataset.c){cin=b.dataset.c;ls('sh:c',cin);day=''}else if(b.dataset.d)day=b.dataset.d;else if(b.dataset.m)mode=b.dataset.m;else return;
  render();
});
fetch('showtimes.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;render()}).catch(()=>{$('#out').innerHTML='<p class="msg">Showtimes could not be loaded. Run the scraper once so showtimes.json exists.</p>'});
</script>
</body>
</html>
