<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

/* Layout: one narrow column. Date stub on the left, ticket cards on the right, month view as a grid of posters. */
:root {
  --bg: #F7F1F6;
  --surface: #FFFFFF;
  --surface-2: #EFE5EE;
  --fg: #22121E;
  --muted: #6B5866;
  --line: #E0D0DD;
  --accent: #FF5FA2;
  --on-accent: #2B0617;
  --accent-ink: #B3125F;
  --accent-vivid: #F2478F;
  --danger: #B3261E;
  --shade: rgba(20, 18, 30, .45);
  --glass: rgba(255, 255, 255, .68); --glass-line: rgba(255, 255, 255, .75); --glass-sel: rgba(27, 26, 36, .08);
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0912; --surface: #161020; --surface-2: #1F1729; --fg: #F1EAF4; --muted: #A394AE;
    --line: #2E2338; --accent: #FF5FA2; --on-accent: #2B0617; --accent-ink: #FF5FA2; --accent-vivid: #FF5FA2; --danger: #FF8A80;
    --shade: rgba(0, 0, 0, .6); color-scheme: dark;
    --glass: rgba(18, 21, 33, .66); --glass-line: rgba(255, 255, 255, .13); --glass-sel: rgba(255, 255, 255, .14);
  }
}
:root[data-theme="dark"] {
  --bg: #0D0912; --surface: #161020; --surface-2: #1F1729; --fg: #F1EAF4; --muted: #A394AE;
  --line: #2E2338; --accent: #FF5FA2; --on-accent: #2B0617; --accent-ink: #FF5FA2; --accent-vivid: #FF5FA2; --danger: #FF8A80;
  --shade: rgba(0, 0, 0, .6); color-scheme: dark;
  --glass: rgba(18, 21, 33, .66); --glass-line: rgba(255, 255, 255, .13); --glass-sel: rgba(255, 255, 255, .14);
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  padding-block: 8px 116px;
  padding-left: max(16px, var(--sai-l, env(safe-area-inset-left, 0px)));
  padding-right: max(16px, var(--sai-r, env(safe-area-inset-right, 0px)));
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 640px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.srch { position: relative; margin-top: 14px; }
.srch input { width: 100%; height: 46px; padding: 0 40px 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; -webkit-appearance: none; appearance: none; }
.srch input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.srch input:focus { outline: none; border-color: var(--accent); }
.srch .qx { position: absolute; right: 4px; top: 3px; width: 40px; height: 40px; border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--muted); }
.srch .qx[hidden] { display: none; }
.rescount { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.set { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sh-head + .set { border-top: 0; padding-top: 0; margin-top: 8px; }
.set .hint { margin: 0; }
.set .row .btn { flex: 1; }
.sh3 { margin: 0; font: 800 18px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.swrow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.swt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.swt b { font-size: 15px; }
.swt span { font-size: 13px; color: var(--muted); }
.steprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; }
.steprow[hidden] { display: none; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper .sv { min-width: 62px; text-align: center; font: 500 15px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.stepper .ibtn { font-size: 20px; }
.set .field { margin-bottom: 0; }
.sw { position: relative; width: 50px; height: 30px; flex: none; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.swrow[aria-checked="true"] .sw { background: var(--accent); border-color: var(--accent); }
.swrow[aria-checked="true"] .sw::after { transform: translateX(20px); background: var(--on-accent); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* polish: depth and softness, no colour changes */
.ticket { border-radius: 18px; box-shadow: 0 8px 22px rgba(10, 8, 24, .10), inset 0 1px 0 rgba(255, 255, 255, .06); }
.ticket .poster { border-radius: 8px; box-shadow: 0 5px 14px rgba(0, 0, 0, .28); }
.srch input { border-radius: 99px; padding-left: 20px; box-shadow: inset 0 1px 3px rgba(10, 8, 24, .10); }
.note { border-radius: 16px; }
.btn { box-shadow: 0 2px 8px rgba(10, 8, 24, .08); }
.fab { box-shadow: 0 4px 10px rgba(10, 8, 24, .22); }
.dl.today .dn { text-shadow: 0 0 18px currentColor; }
.tabs button[aria-pressed="true"] { background: rgba(255, 95, 162, .22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12); }
@media (prefers-reduced-motion: no-preference) {
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .ticket, .cell, .tabs button { transition: background-color .15s, border-color .15s, transform .1s; }
  .ticket:active, .cell:active { transform: scale(.975); }
  .btn:active, .fab:active { transform: scale(.94); }
  .tabs button { transition: background-color .25s ease, color .25s ease, transform .15s ease; }
  .tabs button:active { transform: scale(.92); }
  dialog[open] { animation: frUp .12s cubic-bezier(.15, .5, .55, 1) backwards; }
  dialog[open]::backdrop { animation: frFade .12s ease backwards; }
  dialog.closing { animation: frSlide .12s cubic-bezier(.45, 0, .85, .5) forwards; }
  dialog.closing::backdrop { animation: frFadeOut .12s ease forwards; }
  @keyframes frFadeOut { to { opacity: 0; } }
  @keyframes frSlide { to { transform: translateY(105%); } }
  @keyframes frFade { from { opacity: 0; } }
  @keyframes frUp { from { transform: translateY(105%); } }
}

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 14px 14px; }
.brand { font: 800 44px/.86 var(--font-display); letter-spacing: .05em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--accent-vivid); }
.sub { font: 500 12px/1.3 var(--font-mono); color: var(--muted); margin: 8px 0 0; letter-spacing: .02em; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }


/* agenda */
.day { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; margin-top: 24px; }
.dl { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
.dl .wd { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dl .dn { font: 800 38px/1 var(--font-display); margin-top: 4px; }

  (function () {
    var origClose = HTMLDialogElement.prototype.close, origShow = HTMLDialogElement.prototype.showModal;
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function finish(d, rv) { if (d._ct) { clearTimeout(d._ct); d._ct = 0; } d.classList.remove('closing'); origClose.call(d, rv); }
    HTMLDialogElement.prototype.close = function (rv) {
      var d = this;
      if (!d.open || d._ct || calm) return d._ct ? undefined : origClose.call(d, rv);
      d.classList.add('closing');
      d._ct = setTimeout(function () { finish(d, rv); }, 120);
    };
    HTMLDialogElement.prototype.showModal = function () {
      if (this._ct) finish(this);
      return origShow.call(this);
    };
    document.addEventListener('cancel', function (e) { if (e.target && e.target.tagName === 'DIALOG') { e.preventDefault(); e.target.close(); } }, true);
  })();
